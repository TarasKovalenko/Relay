name: release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to publish, without the leading v (e.g. 1.0.0)'
        required: true
        type: string

permissions:
  contents: write
  id-token: write # NuGet trusted publishing (OIDC)

jobs:
  publish:
    runs-on: ubuntu-latest
    env:
      CI: true
      DOTNET_NOLOGO: true
      DOTNET_SKIP_FIRST_TIME_EXPERIENCE: true
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/setup-dotnet@v6
        with:
          # Relay and its tests target net10.0 and net11.0, so both runtimes must be present.
          dotnet-version: |
            10.0.x
            11.0.x

      - name: Resolve version
        id: version
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            version="${{ inputs.version }}"
          else
            version="${GITHUB_REF_NAME#v}"
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "Publishing $version"

      - name: Restore
        run: dotnet restore Relay.slnx

      - name: Build
        run: dotnet build Relay.slnx -c Release --no-restore -p:Version=${{ steps.version.outputs.version }}

      - name: Test
        run: dotnet test Relay.slnx -c Release --no-build

      - name: Pack
        run: dotnet pack src/Relay.csproj -c Release --no-build -p:Version=${{ steps.version.outputs.version }}

      - uses: actions/upload-artifact@v7
        with:
          name: packages-${{ steps.version.outputs.version }}
          path: artifacts/packages/*.*nupkg

      # Trusted publishing: swaps the GitHub OIDC token for a NuGet API key that lives for 1 hour.
      # Needs a matching policy on nuget.org (owner TarasKovalenko, this repo, workflow release.yml).
      - name: NuGet login
        id: nuget-login
        uses: NuGet/login@v1
        with:
          user: TarasKovalenko

      # --skip-duplicate keeps a re-run from failing when a package version is already live.
      - name: Push to NuGet
        env:
          NUGET_API_KEY: ${{ steps.nuget-login.outputs.NUGET_API_KEY }}
        run: |
          dotnet nuget push "artifacts/packages/*.nupkg" \
            --api-key "$NUGET_API_KEY" \
            --source https://api.nuget.org/v3/index.json \
            --skip-duplicate

      - name: Create GitHub release
        if: github.event_name == 'push'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "${GITHUB_REF_NAME}" artifacts/packages/*.nupkg --generate-notes
